
<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' wss://*.livekit.cloud;" /> -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Premium typography — Inter (body) + Syne (display) + JetBrains Mono (numerics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Primary SEO -->
    <title>HeyGenAlly – AI Agent Builder & Chatbot Platform | Build, Deploy & Automate</title>

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://heygenally.com/" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HeyGenAlly" />
    <meta name="theme-color" content="#8B5CF6" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://heygenally.com/" />
    <meta property="og:site_name" content="HeyGenAlly" />

    <meta property="og:image" content="https://heygenally.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@heygenally" />
    <meta name="twitter:creator" content="@heygenally" />
    <meta name="twitter:title" content="HeyGenAlly – AI Agent Builder & Chatbot Platform" />
    <meta name="twitter:description" content="Build and deploy intelligent AI agents in minutes. Visual workflow builder, multi-LLM support, voice AI, CRM, and embeddable widgets — all in one platform." />
    <meta name="twitter:image" content="https://heygenally.com/og-image.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "HeyGenAlly",
      "url": "https://heygenally.com",
      "description": "HeyGenAlly is an AI agent builder and chatbot platform that lets businesses create, deploy, and manage intelligent conversational agents across web, WhatsApp, voice, and more.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free plan available"
      },
      "featureList": [
        "No-code AI agent builder",
        "Visual workflow automation",
        "Multi-LLM support (OpenAI, Groq, Anthropic)",
        "Knowledge base integration",
        "Voice AI and phone calls",
        "WhatsApp and multi-channel messaging",
        "Embeddable web chat widget",
        "CRM and lead management",
        "Real-time analytics dashboard",
        "White-label support"
      ],
      "creator": {
        "@type": "Organization",
        "name": "HeyGenAlly",
        "url": "https://heygenally.com"
      }
    }
    </script>
  </head>

  <body>
    <!-- Load runtime environment configuration before app -->
    <!-- This script is generated by env-config.sh in Docker deployments -->
    <!-- In dev mode, it returns 404 which is silently ignored -->
    <script src="/env-config.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Skip service worker on localhost — it would cache-bust dev hot-reloads
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
